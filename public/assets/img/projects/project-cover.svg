<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Project cover">
  <rect width="1200" height="600" fill="rgb(18,23,36)"/>
  <!-- subtle grid -->
  <g stroke="rgba(233,196,103,0.10)" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="800" y1="0" x2="800" y2="600"/>
    <line x1="1000" y1="0" x2="1000" y2="600"/>
  </g>
  <!-- ascending line chart motif -->
  <polyline points="120,470 300,400 460,430 640,300 820,330 1000,180 1090,210"
            fill="none" stroke="rgb(233,196,103)" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="rgb(233,196,103)">
    <circle cx="120" cy="470" r="7"/>
    <circle cx="300" cy="400" r="7"/>
    <circle cx="460" cy="430" r="7"/>
    <circle cx="640" cy="300" r="7"/>
    <circle cx="820" cy="330" r="7"/>
    <circle cx="1000" cy="180" r="7"/>
    <circle cx="1090" cy="210" r="7"/>
  </g>
  <text x="120" y="130" fill="rgba(255,255,255,0.92)"
        font-family="'Cinzel', Georgia, serif" font-size="46" font-weight="700"
        letter-spacing="2">CASE STUDY</text>
  <text x="122" y="172" fill="rgb(233,196,103)"
        font-family="'Montserrat', Arial, sans-serif" font-size="20" font-weight="600"
        letter-spacing="6">AI · ML · MLOps</text>
</svg>
